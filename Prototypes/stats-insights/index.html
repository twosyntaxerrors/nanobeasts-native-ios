<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nanobeasts — Stats Insights Prototypes</title>
  <style>
    @font-face {
      font-family: "Aldrich";
      src: url("../../Nanobeasts/Resources/Fonts/Aldrich_400Regular.ttf") format("truetype");
    }
    @font-face {
      font-family: "Space Mono";
      src: url("../../Nanobeasts/Resources/Fonts/SpaceMono_400Regular.ttf") format("truetype");
      font-weight: 400;
    }
    @font-face {
      font-family: "Space Mono";
      src: url("../../Nanobeasts/Resources/Fonts/SpaceMono_700Bold.ttf") format("truetype");
      font-weight: 700;
    }

    :root {
      color-scheme: dark;
      --bg: #030607;
      --surface: #111719;
      --surface-2: #171d20;
      --surface-3: #1c2326;
      --teal: #5ce6d6;
      --teal-rgb: 92, 230, 214;
      --orange: #ff7518;
      --green: #71f3a8;
      --blue: #5bc7ff;
      --purple: #b38aff;
      --white: #f7f8f8;
      --secondary: #a6a6ae;
      --muted: #5d6068;
      --hairline: rgba(92, 230, 214, 0.25);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background:
        radial-gradient(circle at 50% 12%, rgba(92,230,214,.08), transparent 26rem),
        #080b0d;
      color: var(--white);
      font-family: "Space Mono", ui-monospace, monospace;
      -webkit-font-smoothing: antialiased;
    }

    button { font: inherit; }
    #stage {
      min-height: 100vh;
      display: grid;
      place-items: start center;
      padding: 22px 14px 90px;
    }

    .device {
      position: relative;
      width: min(430px, calc(100vw - 28px));
      height: min(900px, calc(100vh - 128px));
      min-height: 690px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 44px;
      background: var(--bg);
      box-shadow: 0 28px 90px rgba(0,0,0,.56);
      isolation: isolate;
    }

    .device::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background-image:
        linear-gradient(rgba(92,230,214,.048) 1px, transparent 1px),
        linear-gradient(90deg, rgba(92,230,214,.048) 1px, transparent 1px);
      background-size: 28px 28px;
      mask-image: linear-gradient(to bottom, black, rgba(0,0,0,.7));
    }

    .island {
      position: absolute;
      z-index: 20;
      top: 10px;
      left: 50%;
      width: 104px;
      height: 29px;
      border-radius: 99px;
      background: #000;
      transform: translateX(-50%);
    }

    .screen {
      height: 100%;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 55px 18px 112px;
      scrollbar-width: none;
    }
    .screen::-webkit-scrollbar { display: none; }

    .screen-header {
      margin: 15px 2px 17px;
    }
    .eyebrow, .section-kicker, .metric-label, .range-label {
      font-family: "Aldrich", sans-serif;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .screen-header h1 {
      margin: 0;
      font-family: "Aldrich", sans-serif;
      font-size: 34px;
      font-weight: 400;
      letter-spacing: .075em;
    }
    .screen-header p {
      margin: 5px 0 0;
      color: var(--secondary);
      font-size: 12px;
    }

    .lifetime-card, .week-card, .insights-shell {
      border: 1px solid rgba(var(--teal-rgb), .44);
      background:
        linear-gradient(145deg, rgba(var(--teal-rgb),.075), transparent 50%),
        rgba(16,20,22,.94);
      box-shadow: inset 0 1px rgba(255,255,255,.025);
    }
    .lifetime-card {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      padding: 18px;
      border-radius: 24px;
    }
    .lifetime-card .eyebrow { color: var(--teal); font-size: 10px; }
    .lifetime-number {
      margin-top: 3px;
      font-family: "Aldrich", sans-serif;
      font-size: 38px;
      line-height: 1;
    }
    .lifetime-caption { margin-top: 6px; color: var(--secondary); font-size: 9px; letter-spacing: .15em; }
    .lifetime-glyph {
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      border: 1px solid var(--hairline);
      border-radius: 17px;
      background: rgba(var(--teal-rgb),.07);
      color: var(--teal);
      font-size: 25px;
    }
    .lifetime-meta {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: 1fr 1px 1fr;
      gap: 13px;
      align-items: center;
      margin-top: 5px;
      padding-top: 13px;
      border-top: 1px solid rgba(255,255,255,.08);
    }
    .mini-meta strong { display: block; font-family: "Aldrich"; font-size: 18px; }
    .mini-meta span { color: var(--secondary); font-size: 8px; letter-spacing: .09em; }
    .divider { width: 1px; height: 34px; background: rgba(255,255,255,.1); }

    .consistency-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 22px 2px 10px;
    }
    .consistency-heading h2 {
      margin: 0;
      font-family: "Aldrich";
      font-size: 14px;
      font-weight: 400;
      letter-spacing: .08em;
    }
    .scope-chip {
      padding: 8px 12px;
      border-radius: 99px;
      background: var(--teal);
      color: #03100f;
      font-family: "Aldrich";
      font-size: 8px;
    }
    .week-card {
      display: flex;
      align-items: end;
      justify-content: space-between;
      height: 115px;
      padding: 16px 14px 13px;
      border-radius: 22px;
    }
    .day {
      width: 38px;
      text-align: center;
      color: var(--muted);
      font-size: 8px;
    }
    .day span {
      display: block;
      height: var(--h);
      min-height: 8px;
      margin: 5px auto 7px;
      border-radius: 99px;
      background: #23282b;
    }
    .day.active { color: var(--teal); }
    .day.active span {
      background: linear-gradient(to top, rgba(var(--teal-rgb),.4), var(--teal));
      box-shadow: 0 0 16px rgba(var(--teal-rgb),.24);
    }

    .insights-shell {
      margin-top: 18px;
      border-radius: 25px;
      animation: insight-enter 520ms var(--ease) both;
    }
    @keyframes insight-enter {
      from { opacity: 0; transform: translateY(12px) scale(.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .insights-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 15px 15px 13px;
    }
    .insights-header h2 {
      margin: 0;
      color: var(--teal);
      font-family: "Aldrich";
      font-size: 18px;
      font-weight: 400;
      letter-spacing: .11em;
      white-space: nowrap;
    }
    .header-line { height: 1px; flex: 1; background: var(--hairline); }
    .disclosure {
      width: 35px;
      height: 35px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 1px solid var(--hairline);
      border-radius: 12px;
      background: rgba(var(--teal-rgb),.06);
      color: var(--teal);
      cursor: pointer;
    }
    .disclosure svg {
      width: 14px;
      transition: transform 320ms var(--ease);
    }
    .insights-shell[data-expanded="true"] .disclosure svg { transform: rotate(180deg); }
    .expanded-region {
      display: grid;
      grid-template-rows: 0fr;
      opacity: 0;
      transition:
        grid-template-rows 380ms var(--ease),
        opacity 220ms ease-out;
    }
    .expanded-region > div { overflow: hidden; }
    .insights-shell[data-expanded="true"] .expanded-region {
      grid-template-rows: 1fr;
      opacity: 1;
    }

    .tabbar {
      position: absolute;
      z-index: 15;
      left: 14px;
      right: 14px;
      bottom: 13px;
      height: 72px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 7px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 27px;
      background: rgba(29,31,34,.78);
      backdrop-filter: blur(17px) saturate(1.3);
      box-shadow: 0 12px 35px rgba(0,0,0,.35);
    }
    .tab {
      display: grid;
      place-items: center;
      gap: 2px;
      border-radius: 21px;
      color: #c8c8cc;
      font-size: 8px;
    }
    .tab b { font-size: 19px; line-height: 1; }
    .tab.active {
      background: rgba(255,255,255,.14);
      color: var(--teal);
    }

    /* Variant 1 — Signal Brief */
    .signal-body { padding: 0 14px 14px; }
    .priority-signal {
      position: relative;
      overflow: hidden;
      padding: 16px;
      border-radius: 19px;
      background:
        radial-gradient(circle at 83% 20%, rgba(255,117,24,.16), transparent 36%),
        #171b1d;
      border: 1px solid rgba(255,117,24,.28);
    }
    .priority-signal::after {
      content: "";
      position: absolute;
      right: -20px;
      bottom: -45px;
      width: 135px;
      height: 135px;
      border: 18px solid rgba(255,117,24,.065);
      border-radius: 50%;
    }
    .priority-top { display: flex; justify-content: space-between; gap: 12px; }
    .status {
      color: var(--orange);
      font-family: "Aldrich";
      font-size: 9px;
      letter-spacing: .1em;
    }
    .time-tag { color: var(--secondary); font-size: 8px; }
    .priority-signal h3 {
      max-width: 285px;
      margin: 10px 0 0;
      font-family: "Aldrich";
      font-size: 20px;
      font-weight: 400;
      line-height: 1.28;
    }
    .delta {
      margin-top: 13px;
      color: var(--orange);
      font-family: "Aldrich";
      font-size: 11px;
    }
    .signal-chips {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      margin-top: 10px;
    }
    .signal-chip {
      min-width: 0;
      padding: 9px 8px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 13px;
      background: rgba(255,255,255,.025);
    }
    .signal-chip strong { display: block; font-family: "Aldrich"; font-size: 13px; }
    .signal-chip span {
      display: block;
      overflow: hidden;
      margin-top: 3px;
      color: var(--secondary);
      font-size: 6px;
      letter-spacing: .07em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .signal-detail { padding-top: 12px; }
    .signal-chart {
      position: relative;
      display: flex;
      align-items: end;
      gap: 7px;
      height: 112px;
      padding: 11px 10px 21px;
      border-radius: 17px;
      background: #15191b;
      border: 1px solid rgba(var(--teal-rgb),.15);
    }
    .signal-chart::after {
      content: "USUAL PACE";
      position: absolute;
      top: 43px;
      left: 10px;
      right: 10px;
      padding-top: 3px;
      border-top: 1px dashed rgba(255,117,24,.55);
      color: rgba(255,117,24,.75);
      font-family: "Aldrich";
      font-size: 6px;
    }
    .signal-chart i {
      flex: 1;
      height: var(--h);
      border-radius: 7px 7px 3px 3px;
      background: linear-gradient(to top, rgba(var(--teal-rgb),.3), var(--teal));
      transform-origin: bottom;
      animation: bar-grow 550ms var(--ease) both;
    }
    @keyframes bar-grow { from { transform: scaleY(.05); opacity: .2; } }
    .action-note {
      display: grid;
      grid-template-columns: 31px 1fr;
      gap: 10px;
      margin-top: 9px;
      padding: 12px;
      border-radius: 15px;
      background: rgba(var(--teal-rgb),.055);
      color: var(--secondary);
      font-size: 9px;
      line-height: 1.55;
    }
    .action-note b { color: var(--teal); font-size: 17px; }
    .action-note strong { color: white; }

    /* Variant 2 — Instrument Deck */
    .deck-body { padding: 0 14px 14px; }
    .instrument-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      padding: 4px;
      border-radius: 15px;
      background: #0c1011;
      border: 1px solid rgba(255,255,255,.08);
    }
    .instrument-tab {
      min-width: 0;
      height: 35px;
      padding: 0 4px;
      border: 0;
      border-radius: 11px;
      background: transparent;
      color: var(--muted);
      font-family: "Aldrich";
      font-size: 7px;
      cursor: pointer;
    }
    .instrument-tab[data-selected] {
      color: #041413;
      background: var(--teal);
    }
    .instrument-panel {
      position: relative;
      min-height: 180px;
      margin-top: 10px;
      overflow: hidden;
      padding: 17px;
      border-radius: 20px;
      background:
        linear-gradient(140deg, rgba(var(--teal-rgb),.08), transparent 45%),
        #151a1c;
      border: 1px solid rgba(var(--teal-rgb),.2);
    }
    .instrument-panel h3 {
      margin: 5px 0 2px;
      font-family: "Aldrich";
      font-size: 21px;
      font-weight: 400;
    }
    .instrument-panel p {
      max-width: 210px;
      margin: 0;
      color: var(--secondary);
      font-size: 8px;
      line-height: 1.55;
    }
    .metric-label { color: var(--teal); font-size: 8px; }
    .orbit {
      position: absolute;
      right: 16px;
      top: 22px;
      width: 105px;
      height: 105px;
      display: grid;
      place-items: center;
      border: 10px solid #2a2f31;
      border-top-color: var(--teal);
      border-left-color: var(--teal);
      border-radius: 50%;
      filter: drop-shadow(0 0 9px rgba(var(--teal-rgb),.18));
      transform: rotate(-35deg);
    }
    .orbit span {
      font-family: "Aldrich";
      font-size: 20px;
      transform: rotate(35deg);
    }
    .micro-trace {
      position: absolute;
      right: 13px;
      bottom: 16px;
      width: 115px;
      height: 38px;
    }
    .micro-trace svg { width: 100%; height: 100%; overflow: visible; }
    .micro-trace path {
      fill: none;
      stroke: var(--teal);
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 180;
      animation: draw 800ms var(--ease) both;
    }
    @keyframes draw { from { stroke-dashoffset: 180; opacity: .3; } to { stroke-dashoffset: 0; } }
    .deck-readout {
      display: flex;
      gap: 7px;
      margin-top: 24px;
    }
    .readout {
      flex: 1;
      padding: 8px;
      border-top: 1px solid rgba(var(--teal-rgb),.25);
    }
    .readout strong { display: block; font-family: "Aldrich"; font-size: 12px; }
    .readout span { color: var(--secondary); font-size: 6px; }
    .deck-expanded { padding-top: 10px; }
    .deck-list {
      display: grid;
      gap: 7px;
    }
    .deck-row {
      display: grid;
      grid-template-columns: 32px 1fr auto;
      align-items: center;
      gap: 9px;
      padding: 10px;
      border-radius: 14px;
      background: rgba(255,255,255,.025);
      border: 1px solid rgba(255,255,255,.07);
    }
    .deck-icon {
      width: 31px;
      height: 31px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: rgba(var(--teal-rgb),.08);
      color: var(--teal);
    }
    .deck-row b { display: block; font-family: "Aldrich"; font-size: 9px; }
    .deck-row small { color: var(--secondary); font-size: 7px; }
    .deck-row strong { font-family: "Aldrich"; font-size: 12px; color: var(--teal); }

    /* Variant 3 — Field Journal */
    .journal-body { padding: 0 14px 14px; }
    .journal-lead {
      position: relative;
      padding: 16px 16px 16px 24px;
      border-radius: 18px;
      background: #15191b;
      border: 1px solid rgba(255,255,255,.08);
    }
    .journal-lead::before {
      content: "";
      position: absolute;
      top: 17px;
      bottom: 17px;
      left: 11px;
      width: 2px;
      border-radius: 2px;
      background: var(--orange);
      box-shadow: 0 0 10px rgba(255,117,24,.5);
    }
    .journal-date { color: var(--secondary); font-size: 7px; letter-spacing: .1em; }
    .journal-lead h3 {
      margin: 8px 0;
      font-family: "Aldrich";
      font-size: 20px;
      font-weight: 400;
      line-height: 1.28;
    }
    .journal-lead p { margin: 0; color: var(--secondary); font-size: 9px; line-height: 1.6; }
    .journal-score {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 13px;
    }
    .score-track {
      height: 4px;
      flex: 1;
      overflow: hidden;
      border-radius: 99px;
      background: #2d3234;
    }
    .score-track i {
      display: block;
      width: 43%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--orange), var(--teal));
      animation: fill-track 700ms var(--ease) both;
      transform-origin: left;
    }
    @keyframes fill-track { from { transform: scaleX(0); } }
    .journal-score b { color: var(--teal); font-family: "Aldrich"; font-size: 10px; }
    .journal-expanded { padding-top: 10px; }
    .journal-entry {
      display: grid;
      grid-template-columns: 10px 1fr;
      gap: 10px;
      padding: 0 3px;
    }
    .journal-rail { position: relative; }
    .journal-rail::before {
      content: "";
      position: absolute;
      top: 8px;
      bottom: -15px;
      left: 4px;
      width: 1px;
      background: rgba(var(--teal-rgb),.22);
    }
    .journal-entry:last-child .journal-rail::before { display: none; }
    .journal-dot {
      position: absolute;
      top: 7px;
      left: 1px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--teal);
      box-shadow: 0 0 9px rgba(var(--teal-rgb),.55);
    }
    .entry-card {
      margin-bottom: 9px;
      overflow: hidden;
      border-radius: 15px;
      background: rgba(255,255,255,.025);
      border: 1px solid rgba(255,255,255,.07);
    }
    .entry-button {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      padding: 12px;
      border: 0;
      background: transparent;
      color: white;
      text-align: left;
      cursor: pointer;
    }
    .entry-button b { font-family: "Aldrich"; font-size: 10px; }
    .entry-button span { color: var(--teal); font-family: "Aldrich"; font-size: 10px; }
    .entry-detail {
      display: none;
      padding: 0 12px 12px;
      color: var(--secondary);
      font-size: 8px;
      line-height: 1.55;
    }
    .entry-card[data-open="true"] .entry-detail { display: block; }
    .entry-graphic {
      height: 38px;
      display: flex;
      align-items: end;
      gap: 4px;
      margin-top: 9px;
    }
    .entry-graphic i {
      flex: 1;
      height: var(--h);
      border-radius: 4px;
      background: rgba(var(--teal-rgb),.62);
    }

    @media (max-height: 760px) {
      #stage { padding-top: 10px; }
      .device { height: calc(100vh - 100px); min-height: 610px; border-radius: 34px; }
      .screen { padding-top: 49px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }

    .proto-picker {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2147483647;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 4px;
      border-radius: 999px;
      background: rgba(10, 10, 10, 0.82);
      -webkit-backdrop-filter: blur(12px) saturate(1.4);
      backdrop-filter: blur(12px) saturate(1.4);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.08) inset,
        0 8px 24px rgba(0, 0, 0, 0.24),
        0 2px 6px rgba(0, 0, 0, 0.12);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      line-height: 1;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
    }
    .proto-picker-highlight {
      position: absolute;
      top: 4px;
      left: 0;
      height: 28px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      will-change: transform;
    }

    /* The slide is enabled only after first paint (data-ready), so load doesn't animate. */
    .proto-picker[data-ready] .proto-picker-highlight {
      transition:
        transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
        width 250ms cubic-bezier(0.23, 1, 0.32, 1);
    }
    @media (prefers-reduced-motion: reduce) {
      .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
    }

    .proto-picker-item {
      position: relative; /* sits above the highlight */
      display: flex;
      align-items: center;
      height: 28px;
      padding: 0 12px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: rgba(255, 255, 255, 0.55);
      font: inherit;
      cursor: pointer;
      transition: color 150ms ease-out;
    }

    .proto-picker-item:hover {
      color: rgba(255, 255, 255, 0.85);
    }
    .proto-picker-item:active {
      transform: scale(0.97);
    }

    .proto-picker-item:focus-visible {
      outline: 2px solid rgba(255, 255, 255, 0.4);
      outline-offset: 2px;
    }

    .proto-picker-item[data-active] {
      color: #fff;
    }

    .proto-picker-divider {
      width: 1px;
      height: 16px;
      margin: 0 4px;
      background: rgba(255, 255, 255, 0.12);
    }

    .proto-picker-replay {
      padding: 0 10px;
      font-size: 14px;
    }

    .proto-picker[data-position="top"] {
      bottom: auto;
      top: 24px;
    }
  </style>
</head>
<body>
  <main id="stage" aria-live="polite"></main>

  <nav class="proto-picker" aria-label="Prototype variants">
    <span class="proto-picker-highlight" aria-hidden="true"></span>
    <button class="proto-picker-item" data-active aria-current="true">Brief</button>
    <button class="proto-picker-item">Deck</button>
    <button class="proto-picker-item">Journal</button>
    <span class="proto-picker-divider" aria-hidden="true"></span>
    <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
  </nav>

  <script>
    const chevron = `
      <svg viewBox="0 0 16 10" fill="none" aria-hidden="true">
        <path d="M2 2l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>`;

    function shell(insights) {
      return `
        <article class="device">
          <div class="island" aria-hidden="true"></div>
          <div class="screen">
            <header class="screen-header">
              <h1>ACTIVITY STATS</h1>
              <p>Your movement powers evolution.</p>
            </header>

            <section class="lifetime-card" aria-label="Lifetime movement">
              <div>
                <div class="eyebrow">Lifetime movement</div>
                <div class="lifetime-number">102,725</div>
                <div class="lifetime-caption">TOTAL STEPS · PAST 12 MONTHS</div>
              </div>
              <div class="lifetime-glyph">▥</div>
              <div class="lifetime-meta">
                <div class="mini-meta"><strong>48.6 MI</strong><span>TOTAL DISTANCE</span></div>
                <i class="divider"></i>
                <div class="mini-meta"><strong>27</strong><span>ACTIVE DAYS</span></div>
              </div>
            </section>

            <div class="consistency-heading">
              <h2>ACTIVITY CONSISTENCY</h2>
              <span class="scope-chip">WEEK</span>
            </div>
            <section class="week-card" aria-label="Current week">
              <div class="day active">S<span style="--h:25%"></span>1.1K</div>
              <div class="day active">M<span style="--h:12%"></span>472</div>
              <div class="day">T<span style="--h:8%"></span>—</div>
              <div class="day">W<span style="--h:8%"></span>—</div>
              <div class="day">T<span style="--h:8%"></span>—</div>
              <div class="day">F<span style="--h:8%"></span>—</div>
              <div class="day">S<span style="--h:8%"></span>—</div>
            </section>

            ${insights}
          </div>

          <nav class="tabbar" aria-label="App tabs">
            <div class="tab"><b>⌂</b><span>Home</span></div>
            <div class="tab active"><b>▥</b><span>Stats</span></div>
            <div class="tab"><b>▤</b><span>Dex</span></div>
            <div class="tab"><b>⚙</b><span>Settings</span></div>
          </nav>
        </article>`;
    }

    function signalBrief() {
      return shell(`
        <section class="insights-shell" data-expanded="false" data-variant="signal">
          <header class="insights-header">
            <h2>INSIGHTS</h2>
            <i class="header-line"></i>
            <button class="disclosure" data-toggle-insights aria-label="Expand insights" aria-expanded="false">${chevron}</button>
          </header>
          <div class="signal-body">
            <div class="priority-signal">
              <div class="priority-top">
                <span class="status">PACE SIGNAL</span>
                <span class="time-tag">UPDATED 11:42 AM</span>
              </div>
              <h3>You’re moving quieter than usual this morning.</h3>
              <div class="delta">−472 STEPS VS. YOUR USUAL PACE</div>
            </div>
            <div class="signal-chips">
              <div class="signal-chip"><strong>57%</strong><span>GOAL CONSISTENCY</span></div>
              <div class="signal-chip"><strong>5.4K</strong><span>BEST DAY</span></div>
              <div class="signal-chip"><strong>~3D</strong><span>EVOLUTION</span></div>
            </div>
            <div class="expanded-region">
              <div class="signal-detail">
                <div class="signal-chart" aria-label="Seven day movement trend">
                  <i style="--h:42%"></i><i style="--h:64%"></i><i style="--h:48%"></i>
                  <i style="--h:82%"></i><i style="--h:57%"></i><i style="--h:71%"></i><i style="--h:20%"></i>
                </div>
                <div class="action-note">
                  <b>↗</b>
                  <div><strong>A 12-minute walk gets you back on pace.</strong><br>That also moves Sludgling roughly 4% closer to evolution.</div>
                </div>
              </div>
            </div>
          </div>
        </section>`);
    }

    const instrumentData = {
      Pace: {
        label: "TODAY VS. USUAL",
        title: "472 behind",
        copy: "Your morning is quieter than your 14-day median at this time.",
        score: "43%",
        a: "1,635", al: "USUAL BY NOW",
        b: "1,163", bl: "TODAY"
      },
      Goal: {
        label: "GOAL CONSISTENCY",
        title: "4 of 7 days",
        copy: "You are most consistent when movement begins before noon.",
        score: "57%",
        a: "6.5K", al: "DAILY GOAL",
        b: "4", bl: "DAYS HIT"
      },
      Rhythm: {
        label: "ACTIVE WINDOW",
        title: "5–7 PM",
        copy: "Your strongest movement window is early evening.",
        score: "68%",
        a: "2.1K", al: "AVG / DAY",
        b: "27", bl: "ACTIVE DAYS"
      },
      Evolution: {
        label: "SLUDGLING FORECAST",
        title: "~3 days",
        copy: "At your recent pace, the next evolution signal is close.",
        score: "71%",
        a: "6.6K", al: "STEPS LEFT",
        b: "2.1K", bl: "RECENT AVG"
      }
    };

    function instrumentDeck() {
      return shell(`
        <section class="insights-shell" data-expanded="false" data-variant="deck">
          <header class="insights-header">
            <h2>INSIGHTS</h2>
            <i class="header-line"></i>
            <button class="disclosure" data-toggle-insights aria-label="Expand insights" aria-expanded="false">${chevron}</button>
          </header>
          <div class="deck-body">
            <div class="instrument-tabs" role="tablist" aria-label="Insight metric">
              ${Object.keys(instrumentData).map((name, index) =>
                `<button class="instrument-tab" data-metric="${name}" ${index === 0 ? "data-selected" : ""}>${name.toUpperCase()}</button>`
              ).join("")}
            </div>
            <div class="instrument-panel" data-instrument-panel></div>
            <div class="expanded-region">
              <div class="deck-expanded">
                <div class="deck-list">
                  <div class="deck-row"><span class="deck-icon">◎</span><span><b>BEST DAY</b><small>JUL 16 · STRONG FINISH</small></span><strong>5.4K</strong></div>
                  <div class="deck-row"><span class="deck-icon">◴</span><span><b>ACTIVE WINDOW</b><small>MOST STEPS ARRIVE HERE</small></span><strong>5–7 PM</strong></div>
                  <div class="deck-row"><span class="deck-icon">✦</span><span><b>EVOLUTION SIGNAL</b><small>AT YOUR CURRENT PACE</small></span><strong>~3 DAYS</strong></div>
                </div>
              </div>
            </div>
          </div>
        </section>`);
    }

    function fieldJournal() {
      return shell(`
        <section class="insights-shell" data-expanded="false" data-variant="journal">
          <header class="insights-header">
            <h2>INSIGHTS</h2>
            <i class="header-line"></i>
            <button class="disclosure" data-toggle-insights aria-label="Expand insights" aria-expanded="false">${chevron}</button>
          </header>
          <div class="journal-body">
            <div class="journal-lead">
              <div class="journal-date">FIELD NOTE · MONDAY, 11:42 AM</div>
              <h3>Your week is still finding its rhythm.</h3>
              <p>Today is behind your usual pace, but one focused walk would restore momentum and keep Sludgling’s forecast intact.</p>
              <div class="journal-score"><div class="score-track"><i></i></div><b>43% OF PACE</b></div>
            </div>
            <div class="expanded-region">
              <div class="journal-expanded">
                <div class="journal-entry">
                  <div class="journal-rail"><i class="journal-dot"></i></div>
                  <div class="entry-card" data-entry data-open="true">
                    <button class="entry-button" data-toggle-entry><b>MOVEMENT PATTERN</b><span>−472</span></button>
                    <div class="entry-detail">
                      Your usual movement builds after lunch. A short walk before 2 PM would put today back inside your normal range.
                      <div class="entry-graphic"><i style="--h:22%"></i><i style="--h:31%"></i><i style="--h:58%"></i><i style="--h:82%"></i><i style="--h:49%"></i><i style="--h:37%"></i></div>
                    </div>
                  </div>
                </div>
                <div class="journal-entry">
                  <div class="journal-rail"><i class="journal-dot"></i></div>
                  <div class="entry-card" data-entry data-open="false">
                    <button class="entry-button" data-toggle-entry><b>CONSISTENCY</b><span>57%</span></button>
                    <div class="entry-detail">Four of your last seven journey days reached the goal. Earlier starts correlate with your strongest days.</div>
                  </div>
                </div>
                <div class="journal-entry">
                  <div class="journal-rail"><i class="journal-dot"></i></div>
                  <div class="entry-card" data-entry data-open="false">
                    <button class="entry-button" data-toggle-entry><b>EVOLUTION OUTLOOK</b><span>~3 DAYS</span></button>
                    <div class="entry-detail">Sludgling needs 6,600 more steps. Your recent average keeps the evolution within this week.</div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>`);
    }

    // `variants` is an array of render functions, one per variant, in picker order.
    const variants = [signalBrief, instrumentDeck, fieldJournal];
    const stage = document.getElementById('stage');
    const picker = document.querySelector('.proto-picker');
    const highlight = picker.querySelector('.proto-picker-highlight');
    const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
    const replay = picker.querySelector('.proto-picker-replay');
    let current = 0;
    function moveHighlight() {
      const el = items[current];
      highlight.style.width = el.offsetWidth + 'px';
      highlight.style.transform = `translateX(${el.offsetLeft}px)`;
    }

    function mount(i) {
      stage.innerHTML = '';
      // Clear first, render next frame, so entrance animations re-run.
      requestAnimationFrame(() => {
        stage.innerHTML = variants[i]();
        hydrateVariant();
      });
    }
    function setActive(i) {
      if (i < 0 || i >= variants.length) return;
      current = i;
      items.forEach((el, j) => {
        el.toggleAttribute('data-active', j === i);
        if (j === i) el.setAttribute('aria-current', 'true');
        else el.removeAttribute('aria-current');
      });
      moveHighlight();
      const url = new URL(location);
      url.searchParams.set('v', i + 1);
      history.replaceState(null, '', url);
      mount(i);
    }
    items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
    replay?.addEventListener('click', () => mount(current));
    window.addEventListener('resize', moveHighlight);
    document.addEventListener('keydown', (e) => {
      if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const num = parseInt(e.key, 10);
      if (num >= 1 && num <= variants.length) setActive(num - 1);
      else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
      else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
      else if (e.key === 'r' || e.key === 'R') mount(current);
    });
    setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
    // Enable the slide only after first paint, so load doesn't animate.
    requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));

    function hydrateVariant() {
      const shell = stage.querySelector('.insights-shell');
      const disclosure = stage.querySelector('[data-toggle-insights]');
      disclosure?.addEventListener('click', () => {
        const expanded = shell.dataset.expanded !== 'true';
        shell.dataset.expanded = String(expanded);
        disclosure.setAttribute('aria-expanded', String(expanded));
        disclosure.setAttribute('aria-label', expanded ? 'Condense insights' : 'Expand insights');
        if (expanded) {
          requestAnimationFrame(() => shell.scrollIntoView({ behavior: 'smooth', block: 'nearest' }));
        }
      });

      stage.querySelectorAll('[data-toggle-entry]').forEach(button => {
        button.addEventListener('click', () => {
          const card = button.closest('[data-entry]');
          card.dataset.open = String(card.dataset.open !== 'true');
        });
      });

      const panel = stage.querySelector('[data-instrument-panel]');
      const metricButtons = [...stage.querySelectorAll('[data-metric]')];
      if (panel && metricButtons.length) {
        const showMetric = name => {
          const data = instrumentData[name];
          metricButtons.forEach(button => button.toggleAttribute('data-selected', button.dataset.metric === name));
          panel.innerHTML = `
            <div class="metric-label">${data.label}</div>
            <h3>${data.title}</h3>
            <p>${data.copy}</p>
            <div class="orbit"><span>${data.score}</span></div>
            <div class="deck-readout">
              <div class="readout"><strong>${data.a}</strong><span>${data.al}</span></div>
              <div class="readout"><strong>${data.b}</strong><span>${data.bl}</span></div>
            </div>
            <div class="micro-trace">
              <svg viewBox="0 0 115 38" aria-hidden="true">
                <path d="M2 31 C15 31, 14 22, 28 25 S43 7, 55 19 S68 30, 80 14 S97 20, 113 5"/>
              </svg>
            </div>`;
        };
        metricButtons.forEach(button => button.addEventListener('click', () => showMetric(button.dataset.metric)));
        showMetric(metricButtons.find(button => button.hasAttribute('data-selected'))?.dataset.metric || 'Pace');
      }
    }
  </script>
</body>
</html>
