<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1170, height=2532">
  <title>Nanobeasts · Real App Core Loop</title>
  <script src="assets/gsap.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #070b0a; }
    #root {
      position: relative;
      width: 1170px;
      height: 2532px;
      overflow: hidden;
      background: #070b0a;
    }
    #app-loop {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #070b0a;
    }
    .fade {
      position: absolute;
      inset: 0;
      background: #070b0a;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-width="1170" data-height="2532" data-start="0" data-duration="24.70" data-fps="30">
    <video id="app-loop" class="clip" src="assets/app-loop-cut.mp4" data-start="0" data-duration="24.70" data-track-index="0" muted playsinline></video>
    <div id="fade-in" class="fade clip" data-start="0" data-duration="0.35" data-track-index="1"></div>
    <div id="fade-out" class="fade clip" data-start="24.35" data-duration="0.35" data-track-index="2"></div>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    tl.fromTo('#fade-in', { opacity: 1 }, { opacity: 0, duration: 0.35, ease: 'power2.out' }, 0);
    tl.fromTo('#fade-out', { opacity: 0 }, { opacity: 1, duration: 0.35, ease: 'power2.in' }, 24.35);
    window.__timelines.main = tl;
  </script>
</body>
</html>
