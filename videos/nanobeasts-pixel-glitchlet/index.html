<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=2340">
  <title>Nanobeasts — Pixel Glitchlet</title>
  <script src="assets/gsap.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1080px; height: 2340px; overflow: hidden; background: #000; }
    #main-stage { width: 100%; height: 100%; position: relative; background: #000; }
    #glitchlet-loop { position: absolute; inset: 0; }
  </style>
</head>
<body>
  <div data-hf-id="hf-xxmy" id="main-stage" data-composition-id="main" data-start="0" data-duration="3.2" data-fps="30" data-width="1080" data-height="2340">
    <div data-hf-id="hf-pe9e" id="glitchlet-loop" class="clip" data-composition-id="glitchlet-loop" data-composition-src="compositions/index.html" data-start="0" data-duration="3.2" data-track-index="0" data-fps="30" data-width="1080" data-height="2340"></div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    window.__timelines["main"] = tl;
    tl.seek(0);
  </script>
</body>
</html>
