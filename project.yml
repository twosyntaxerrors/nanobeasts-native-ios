name: Nanobeasts
options:
  bundleIdPrefix: com.twosyntaxerrors
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    SWIFT_STRICT_CONCURRENCY: minimal
packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: 5.0.0
  SDWebImage:
    url: https://github.com/SDWebImage/SDWebImage.git
    from: 5.21.7
  SDWebImageWebPCoder:
    url: https://github.com/SDWebImage/SDWebImageWebPCoder.git
    from: 0.3.0
targets:
  Nanobeasts:
    type: application
    platform: iOS
    sources:
      - path: Nanobeasts
        excludes:
          - Info.plist
          - Nanobeasts.entitlements
      - path: NanobeastsShared
    dependencies:
      - sdk: HealthKit.framework
      - sdk: CoreMotion.framework
      - sdk: Charts.framework
      - target: NanobeastsWidgets
        embed: true
      - package: RevenueCat
        product: RevenueCat
      - package: SDWebImage
        product: SDWebImage
      - package: SDWebImageWebPCoder
        product: SDWebImageWebPCoder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.twosyntaxerrors.nanobeasts.native
        PRODUCT_NAME: Nanobeasts
        INFOPLIST_FILE: Nanobeasts/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Nanobeasts/Nanobeasts.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
        DEVELOPMENT_TEAM: C48J72F8MH
      configs:
        Debug:
          CODE_SIGN_STYLE: Manual
          PROVISIONING_PROFILE_SPECIFIER: Nanobeasts Native Development
          REVENUECAT_PUBLIC_SDK_KEY: "test_xSlHgKrlMPvMaQveiyUUaYAdrye"
        Release:
          CODE_SIGN_STYLE: Automatic
          REVENUECAT_PUBLIC_SDK_KEY: "appl_RZwqUISPAKgFHefFFZAtDpyOvdC"
  NanobeastsWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: NanobeastsWidgets
        excludes:
          - Info.plist
          - NanobeastsWidgets.entitlements
      - path: NanobeastsShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.twosyntaxerrors.nanobeasts.native.widgets
        PRODUCT_NAME: NanobeastsWidgets
        INFOPLIST_FILE: NanobeastsWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: NanobeastsWidgets/NanobeastsWidgets.entitlements
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
        DEVELOPMENT_TEAM: C48J72F8MH
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
      configs:
        Debug:
          CODE_SIGN_STYLE: Manual
          PROVISIONING_PROFILE_SPECIFIER: Nanobeasts Native Widgets Development
        Release:
          CODE_SIGN_STYLE: Automatic
schemes:
  Nanobeasts:
    build:
      targets:
        Nanobeasts: all
        NanobeastsWidgets: all
    run:
      config: Debug
    archive:
      config: Release
